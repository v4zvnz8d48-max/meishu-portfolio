<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ショート動画制作 | Meishu.YURI Yamada Portfolio</title>
    <meta name="description" content="編集を担当した商品のショート動画作品の実績詳細ページです。">
    <link rel="stylesheet" href="css/destyle.css" type="text/css">
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Zen+Kaku+Gothic+Antique&display=swap"
        rel="stylesheet">
</head>

<body>

    <div id="headerContainer" data-header-path="header.html"></div>

    <main>
        <section id="works04_wrap">

            <div class="work-breadcrumb">
                <a href="index.html#works">Worksへ戻る</a>
            </div>

            <div class="work-hero">
                <h5 class="sans_flex">MOVIE</h5>
                <div class="section_subtitle">ショート動画制作</div>
                <p class="hero_copy">
                    見る人を飽きさせないテンポ感と、高級感を両立させるためテロップの表示速度にこだわって制作しました。
                </p>
            </div>

            <div class="video-showcase">
                <div class="video-frame">
                    <iframe
                        src="https://www.youtube.com/embed/hdhDY7cX8mg?si=vYC91zEo454DQcJX&autoplay=1&mute=1&loop=1&playlist=hdhDY7cX8mg&playsinline=1"></iframe>
                </div>
            </div>

            <dl class="work-meta-list">
                <div>
                    <dt>制作範囲</dt>
                    <dd>編集</dd>
                </div>
                <div>
                    <dt>使用ツール</dt>
                    <dd>Premiere Pro</dd>
                </div>
                <div>
                    <dt>尺</dt>
                    <dd>約30秒</dd>
                </div>
                <div>
                    <dt>フォーマット</dt>
                    <dd>縦型 9:16</dd>
                </div>
            </dl>

            <div class="work-detail-text">
                <h3>制作のポイント</h3>
                <p>
                    冒頭2秒で内容が伝わるよう構成を工夫し、テロップと音楽のタイミングを細かく調整しました。<br>
                    縦型スマートフォン画面での視聴を前提に、被写体の配置やカメラワークも縦構図に最適化しています。
                </p>
            </div>

            <div class="work-nextprev">
                <a href="works03.html">← 前の実績</a>
                <a href="index.html#works">Works一覧へ →</a>
            </div>

        </section>
    </main>

    <div id="footer"></div>

    <script>
        // header.html を読み込んで、挿入後にヘッダー用のイベントをセットアップする
        const headerContainer = document.getElementById('headerContainer');
        const headerPath = headerContainer.dataset.headerPath || 'header.html';

        fetch(headerPath)
            .then(response => response.text())
            .then(html => {
                headerContainer.innerHTML = html;
                initHeader();
            })
            .catch(error => {
                console.error('headerの読み込みに失敗しました', error);
            });

        function initHeader() {
            const header = document.getElementById('siteHeader');
            const menuBtn = document.getElementById('menuBtn');
            const navOverlay = document.getElementById('navOverlay');

            header.classList.add('visible');

            menuBtn.addEventListener('click', () => {
                const isOpen = navOverlay.classList.toggle('open');
                menuBtn.classList.toggle('open', isOpen);
                header.classList.toggle('open', isOpen);
                menuBtn.setAttribute('aria-expanded', isOpen);
            });

            navOverlay.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    navOverlay.classList.remove('open');
                    menuBtn.classList.remove('open');
                    header.classList.remove('open');
                    menuBtn.setAttribute('aria-expanded', 'false');
                });
            });
        }

        // footer.html を読み込む
        fetch('footer.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('footer').innerHTML = html;
            })
            .catch(error => {
                document.getElementById('footer').innerHTML = '読み込みに失敗しました。';
            });

        // テキストリビール（h1, h2, .hero_copyが画面内に入ったら下から迫り上がらせる）
        const isMobileWidth = () => window.matchMedia('(max-width: 767px)').matches;
        const textRevealOptions = isMobileWidth()
            ? { threshold: 0.1, rootMargin: '0px 0px -5% 0px' }
            : { threshold: 0.2, rootMargin: '0px 0px -10% 0px' };

        const textRevealObserver = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-animated');
                    obs.unobserve(entry.target);
                }
            });
        }, textRevealOptions);

        function setupTextReveal(root = document) {
            root.querySelectorAll('h1, h2, .hero_copy').forEach(el => {
                if (el.classList.contains('text-reveal-parent') || el.classList.contains('text-reveal')) return;

                const lines = el.querySelectorAll(':scope > .reveal-line');

                if (lines.length > 0) {
                    el.classList.add('text-reveal-parent');
                    lines.forEach((line, i) => {
                        line.classList.add('text-reveal');
                        const inner = document.createElement('span');
                        inner.className = 'text-reveal-inner';
                        inner.innerHTML = line.innerHTML;
                        inner.style.transitionDelay = (i * 150) + 'ms';
                        line.innerHTML = '';
                        line.appendChild(inner);
                        textRevealObserver.observe(line);
                    });
                } else {
                    el.classList.add('text-reveal');
                    const inner = document.createElement('span');
                    inner.className = 'text-reveal-inner';
                    inner.innerHTML = el.innerHTML;
                    el.innerHTML = '';
                    el.appendChild(inner);
                    textRevealObserver.observe(el);
                }
            });
        }

        setupTextReveal();
    </script>

</body>

</html>
